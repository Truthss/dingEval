
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日常报销 · 钉钉</title>
  <style>
    :root {
      --brand-primary: #007FFF;
      --brand-primary-hover: #0075EB;
      --brand-primary-press: #006AD6;
      --brand-on-primary: #FFFFFF;
      --brand-secondary: #5AC8FA;
      --brand-accent: #00B042;
      --brand-link: #317EDD;

      --brand-canvas: #FFFFFF;
      --brand-canvas-soft: #F2F2F6;
      --brand-canvas-page: #F2F2F6;
      --brand-surface: #FFFFFF;
      --brand-surface-tint: rgba(0, 127, 255, 0.04);
      --brand-surface-amount: linear-gradient(180deg, rgba(0, 127, 255, 0.06) 0%, rgba(0, 127, 255, 0.02) 100%);

      --brand-ink: #171A1D;
      --brand-ink-rgb: 23, 26, 29;
      --brand-body: rgba(23, 26, 29, 0.6);
      --brand-mute: rgba(23, 26, 29, 0.24);
      --brand-placeholder: rgba(23, 26, 29, 0.32);
      --brand-stamp: rgba(23, 26, 29, 0.04);

      --brand-hairline: rgba(126, 134, 142, 0.16);
      --brand-hairline-strong: rgba(126, 134, 142, 0.24);

      --brand-success: #00B042;
      --brand-warning: #FF9200;
      --brand-error: #FF5219;

      --brand-radius-xs: 4px;
      --brand-radius-sm: 6px;
      --brand-radius-md: 8px;
      --brand-radius-lg: 12px;
      --brand-radius-full: 9999px;

      --brand-shadow-s: 0 1px 4px rgba(0, 0, 0, 0.16);
      --brand-shadow-m: 0 8px 24px rgba(0, 0, 0, 0.16);
      --brand-shadow-l: 0 12px 32px rgba(0, 0, 0, 0.24);
      --brand-focus-ring: 0 0 0 2px rgba(0, 127, 255, 0.12);

      --brand-font: "PingFang SC", "SF Pro Text", "Segoe UI", "Microsoft YaHei", "微软雅黑", Roboto, system-ui, sans-serif;
      --brand-font-mono: "SFMono-Regular", Menlo, Consolas, "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--brand-font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--brand-ink);
      background: var(--brand-canvas-page);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; }
    input, textarea, select { font: inherit; color: inherit; }
    textarea { resize: none; }

    .stage {
      min-height: 100vh;
      padding: 24px 16px 120px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .device {
      width: 100%;
      max-width: 480px;
      background: var(--brand-canvas-soft);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(23, 26, 29, 0.10), 0 4px 12px rgba(23, 26, 29, 0.04);
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 768px) {
      .stage { padding: 0; }
      .device { max-width: 100%; border-radius: 0; box-shadow: none; }
    }

    .nav-bar {
      height: 48px;
      padding: 0 12px;
      background: var(--brand-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--brand-shadow-s);
    }
    .nav-bar .back {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      display: grid; place-items: center;
      color: var(--brand-ink);
      border-radius: var(--brand-radius-sm);
    }
    .nav-bar .back:hover { background: rgba(126, 134, 142, 0.08); }
    .nav-bar .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--brand-ink);
    }

    .card {
      background: var(--brand-surface);
      border-radius: var(--brand-radius-md);
      margin: 12px 12px 0;
      box-shadow: var(--brand-shadow-s);
      overflow: hidden;
    }
    .card + .card { margin-top: 12px; }
    .card-pad { padding: 16px; }
    .card-section + .card-section { border-top: 1px solid var(--brand-hairline); }
    .card-section { padding: 14px 16px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      color: var(--brand-ink);
      letter-spacing: -0.01em;
    }
    .section-title .remove {
      color: var(--brand-error);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex; align-items: center; gap: 2px;
      padding: 4px 6px;
      border-radius: var(--brand-radius-xs);
    }
    .section-title .remove:hover { background: rgba(255, 82, 25, 0.08); }

    .related-pill {
      margin: 12px 12px 0;
      background: var(--brand-canvas);
      border-radius: var(--brand-radius-sm);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: var(--brand-shadow-s);
      cursor: pointer;
      transition: background .15s;
    }
    .related-pill:hover { background: rgba(126, 134, 142, 0.08); }
    .related-pill .icon {
      width: 20px; height: 20px;
      color: var(--brand-primary);
      display: grid; place-items: center;
    }
    .related-pill .text {
      color: var(--brand-primary);
      font-size: 15px;
      font-weight: 500;
    }
    .related-pill .chevron {
      margin-left: auto;
      color: var(--brand-mute);
    }

    .total-card {
      margin: 12px 12px 0;
      background: var(--brand-surface-amount);
      border-radius: var(--brand-radius-md);
      padding: 18px 16px 14px;
      box-shadow: var(--brand-shadow-s);
      position: relative;
      overflow: hidden;
    }
    .total-card .label {
      font-size: 13px;
      color: var(--brand-body);
      margin-bottom: 6px;
    }
    .total-card .amount {
      display: flex; align-items: baseline; gap: 4px;
      margin-bottom: 14px;
    }
    .total-card .amount .symbol {
      font-size: 18px;
      color: var(--brand-error);
      font-weight: 500;
    }
    .total-card .amount .num {
      font-size: 32px;
      color: var(--brand-error);
      font-weight: 600;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      font-family: var(--brand-font-mono);
    }
    .total-card .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px dashed var(--brand-hairline-strong);
    }
    .total-card .action {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 4px 0;
      color: var(--brand-primary);
      font-size: 12px;
      border-radius: var(--brand-radius-xs);
      transition: background .15s;
    }
    .total-card .action:hover { background: rgba(0, 127, 255, 0.06); }
    .total-card .action svg { width: 20px; height: 20px; }

    .field {
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      min-height: 48px;
      position: relative;
      flex-wrap: wrap;
    }
    .field + .field { border-top: 1px solid var(--brand-hairline); }
    .field.block { align-items: flex-start; }
    .field .label {
      font-size: 14px;
      color: var(--brand-ink);
      min-width: 96px;
      display: flex; align-items: center; gap: 2px;
      flex-shrink: 0;
    }
    .field .label .req {
      color: var(--brand-error);
      font-size: 13px;
      line-height: 1;
    }
    .field .label .help {
      color: var(--brand-mute);
      margin-left: 4px;
      display: grid; place-items: center;
    }
    .field .control {
      flex: 1 1 0; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      justify-content: flex-end;
    }
    .field .control.start { justify-content: flex-start; }
    .field .control input,
    .field .control textarea {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 14px;
      color: var(--brand-ink);
      text-align: right;
      padding: 6px 0;
    }
    .field .control input::placeholder,
    .field .control textarea::placeholder { color: var(--brand-placeholder); }
    .field .control textarea {
      text-align: left;
      line-height: 1.5;
      min-height: 60px;
      padding: 6px 0 0;
    }
    .field .control input:focus-visible,
    .field .control textarea:focus-visible {
      outline: none;
      box-shadow: inset 0 -1px 0 var(--brand-primary);
      color: var(--brand-ink);
    }
    .field .value {
      flex: 1 1 0; min-width: 0;
      text-align: right;
      font-size: 14px;
      color: var(--brand-ink);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field .value.placeholder { color: var(--brand-placeholder); }
    .field .value.readonly { color: var(--brand-ink); }
    .field .value.muted { color: var(--brand-body); }
    .field .suffix {
      color: var(--brand-mute);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .field .suffix.right { color: var(--brand-mute); }
    .field .picker-trigger {
      display: flex; align-items: center; gap: 8px;
      flex: 1 1 0; min-width: 0; justify-content: flex-end;
      cursor: pointer;
      font-size: 14px;
      color: var(--brand-ink);
      background: transparent;
      border: 0;
      padding: 0;
    }
    .field .picker-trigger.placeholder { color: var(--brand-placeholder); }
    .field .picker-trigger:hover .chevron { color: var(--brand-primary); }
    .field .picker-trigger:focus-visible {
      outline: none;
      box-shadow: inset 0 -1px 0 var(--brand-primary);
    }
    .field.has-error { background: rgba(255, 82, 25, 0.04); }
    .field.has-error .label { color: var(--brand-error); }
    .field.has-error input,
    .field.has-error textarea { color: var(--brand-error); }
    .field .error-text {
      flex: 1 0 100%;
      font-size: 11px;
      color: var(--brand-error);
      text-align: right;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin: -2px 0 0;
      letter-spacing: 0.01em;
    }
    .field .error-text::before {
      content: '';
      width: 12px; height: 12px;
      background: var(--brand-error);
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='8' x2='12' y2='12'/><line x1='12' y1='16' x2='12.01' y2='16'/></svg>") no-repeat center / contain;
              mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><line x1='12' y1='8' x2='12' y2='12'/><line x1='12' y1='16' x2='12.01' y2='16'/></svg>") no-repeat center / contain;
      flex-shrink: 0;
    }

    .sub-block {
      padding: 12px 16px 14px;
      background: var(--brand-canvas-soft);
    }
    .sub-block + .sub-block { border-top: 1px solid var(--brand-hairline); }
    .sub-block .sub-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .sub-block .sub-head h5 {
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-ink);
    }
    .add-btn {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--brand-primary);
      font-size: 13px;
      font-weight: 500;
      padding: 4px 6px;
      border-radius: var(--brand-radius-xs);
    }
    .add-btn:hover { background: rgba(0, 127, 255, 0.06); }
    .add-btn svg { width: 14px; height: 14px; }
    .sub-block .hint {
      font-size: 12px;
      color: var(--brand-body);
      margin: 0 0 10px;
      line-height: 1.5;
    }
    .chip-row {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px;
      border-radius: var(--brand-radius-full);
      font-size: 12px;
      background: var(--brand-canvas);
      color: var(--brand-body);
      border: 1px solid var(--brand-hairline);
      cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--brand-hairline-strong); }
    .chip.active {
      background: rgba(0, 127, 255, 0.08);
      color: var(--brand-primary);
      border-color: rgba(0, 127, 255, 0.20);
      font-weight: 500;
    }
    .chip .help {
      color: var(--brand-mute);
      display: grid; place-items: center;
      margin-left: 2px;
    }

    .attach-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      color: var(--brand-primary);
      font-size: 14px;
      font-weight: 500;
    }
    .attach-row:hover { background: rgba(126, 134, 142, 0.06); }
    .attach-row svg { width: 16px; height: 16px; }

    .add-detail-card {
      margin: 12px 12px 0;
      background: var(--brand-canvas);
      border-radius: var(--brand-radius-sm);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--brand-primary);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--brand-shadow-s);
      cursor: pointer;
      transition: background .15s;
    }
    .add-detail-card:hover { background: rgba(0, 127, 255, 0.04); }

    .readonly-field .value { color: var(--brand-ink); }

    .notify-section { padding: 14px 16px; }
    .notify-section .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .notify-section .row .left {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px;
      color: var(--brand-ink);
    }
    .notify-section .row .left svg { color: var(--brand-mute); width: 14px; height: 14px; }
    .notify-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 12px;
    }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px 5px 8px;
      background: rgba(0, 127, 255, 0.08);
      color: var(--brand-primary);
      border-radius: var(--brand-radius-full);
      font-size: 13px;
    }
    .tag-pill .avatar {
      width: 18px; height: 18px;
      border-radius: var(--brand-radius-full);
      background: var(--brand-primary);
      color: var(--brand-on-primary);
      display: grid; place-items: center;
      font-size: 10px;
      font-weight: 600;
    }
    .tag-pill .close {
      color: var(--brand-mute);
      display: grid; place-items: center;
      width: 14px; height: 14px;
    }
    .tag-pill .close:hover { color: var(--brand-error); }

    .flow-list .flow-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      position: relative;
    }
    .flow-list .flow-item + .flow-item { border-top: 1px solid var(--brand-hairline); }
    .flow-list .dot {
      width: 10px; height: 10px;
      border-radius: var(--brand-radius-full);
      background: var(--brand-canvas-soft);
      border: 2px solid var(--brand-primary);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .flow-list .flow-item + .flow-item .dot::before {
      content: '';
      position: absolute;
      left: 50%; top: -14px; transform: translateX(-50%);
      width: 1px; height: 12px;
      background: var(--brand-hairline);
    }
    .flow-list .flow-item .info {
      flex: 1; min-width: 0;
    }
    .flow-list .flow-item .info .name {
      font-size: 14px;
      color: var(--brand-ink);
      display: flex; align-items: center; gap: 4px;
    }
    .flow-list .flow-item .info .name .req { color: var(--brand-error); font-size: 12px; }
    .flow-list .flow-item .info .meta {
      font-size: 12px;
      color: var(--brand-mute);
      margin-top: 2px;
    }
    .flow-list .flow-item .add-btn-icon {
      width: 28px; height: 28px;
      border-radius: var(--brand-radius-xs);
      background: var(--brand-canvas-soft);
      color: var(--brand-primary);
      border: 0;
      display: grid; place-items: center;
      transition: background .15s, transform .12s;
    }
    .flow-list .flow-item .add-btn-icon svg { width: 16px; height: 16px; }
    .flow-list .flow-item .add-btn-icon:hover { background: rgba(0, 127, 255, 0.12); }
    .flow-list .flow-item .add-btn-icon:active { transform: scale(0.94); }
    .flow-list .flow-item .add-btn-icon:focus-visible {
      outline: 2px solid var(--brand-primary);
      outline-offset: 2px;
    }
    .flow-list .flow-item.has-error .info .meta { color: var(--brand-error); }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      left: 0; right: 0;
      background: var(--brand-canvas);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex; gap: 12px;
      border-top: 1px solid var(--brand-hairline);
      z-index: 20;
    }
    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--brand-radius-sm);
      font-size: 15px;
      font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 4px;
      transition: all .15s;
      border: 0;
      cursor: pointer;
    }
    .btn:focus-visible {
      outline: 2px solid var(--brand-primary);
      outline-offset: 2px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--brand-canvas);
      color: var(--brand-ink);
      border: 1px solid var(--brand-hairline-strong);
      flex: 0.8;
    }
    .btn-secondary:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
    .btn-primary {
      background: var(--brand-primary);
      color: var(--brand-on-primary);
    }
    .btn-primary:hover { background: var(--brand-primary-hover); }
    .btn-primary:active { background: var(--brand-primary-press); }
    .btn-primary[disabled] { background: var(--brand-mute); cursor: not-allowed; }

    .ding-footer {
      padding: 20px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--brand-mute);
    }
    .ding-footer .logo {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--brand-body);
      font-size: 12px;
    }
    .ding-footer .logo .mark {
      width: 18px; height: 18px;
      background: var(--brand-primary);
      color: var(--brand-on-primary);
      border-radius: 4px;
      display: grid; place-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .ding-footer .tagline {
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .popover-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.40);
      z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fade-in .15s ease-out;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .popover {
      width: 100%; max-width: 480px;
      background: var(--brand-canvas);
      border-radius: var(--brand-radius-lg) var(--brand-radius-lg) 0 0;
      animation: slide-up .25s ease-out;
      max-height: 70vh;
      display: flex; flex-direction: column;
    }
    .popover-head {
      padding: 16px 20px 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .popover-head h4 { font-size: 16px; font-weight: 600; }
    .popover-head .close-btn {
      color: var(--brand-mute);
      width: 28px; height: 28px;
      display: grid; place-items: center;
    }
    .popover-body {
      padding: 8px 0 20px;
      overflow-y: auto;
    }
    .popover.opt-list .opt {
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      transition: background .12s;
    }
    .popover.opt-list .opt:hover { background: var(--brand-canvas-soft); }
    .popover.opt-list .opt.selected { color: var(--brand-primary); font-weight: 500; }
    .popover.opt-list .opt.selected .check { color: var(--brand-primary); }
    .popover.opt-list .opt .label { font-size: 15px; }
    .popover.opt-list .opt .check { color: transparent; }

    .date-picker {
      padding: 8px 16px 16px;
    }
    .date-picker .dp-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 4px 12px;
    }
    .date-picker .dp-head .nav-btn {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      color: var(--brand-primary);
      border-radius: var(--brand-radius-full);
    }
    .date-picker .dp-head .nav-btn:hover { background: rgba(0, 127, 255, 0.08); }
    .date-picker .dp-head .month-label {
      font-size: 16px; font-weight: 600;
    }
    .date-picker .week-row,
    .date-picker .day-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .date-picker .week-row > div {
      text-align: center;
      font-size: 12px;
      color: var(--brand-mute);
      padding: 6px 0;
      letter-spacing: 0.04em;
    }
    .date-picker .day-row .day {
      aspect-ratio: 1 / 1;
      display: grid; place-items: center;
      font-size: 14px;
      color: var(--brand-ink);
      border-radius: var(--brand-radius-full);
      cursor: pointer;

    function Popover({ onClose, children, className = '' }) {
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [onClose]);
      return (
        <div className="popover-mask" onClick={onClose}>
          <div className={`popover ${className}`} onClick={(e) => e.stopPropagation()}>
            {children}
          </div>
        </div>
      );

    function OptionList({ title, options, value, onSelect, onClose }) {
      return (
        <Popover onClose={onClose} className="opt-list">
          <div className="popover-head">
            <h4>{title}</h4>
            <button type="button" className="close-btn" onClick={onClose}>
              <Icon.Close />
            </button>
          </div>
          <div className="popover-body">
            {options.map((o) => (
              <div
                key={o.value}
                className={`opt ${value === o.value ? 'selected' : ''}`}
                onClick={() => { onSelect(o); onClose(); }}
              >
                <span className="label">{o.label}</span>
                <span className="check"><Icon.Check /></span>
              </div>
            ))}
          </div>
        </Popover>
      );
    }

    function DatePicker({ value, onSelect, onClose }) {
      const initial = value ? new Date(value) : new Date();
      const [viewYear, setViewYear] = useState(initial.getFullYear());
      const [viewMonth, setViewMonth] = useState(initial.getMonth());
      const today = new Date();
      const selected = value ? new Date(value) : null;

      const monthLabel = `${viewYear} 年 ${pad2(viewMonth + 1)} 月`;
      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

      const cells = [];
      for (let i = firstDay - 1; i >= 0; i--) {
        cells.push({ d: prevMonthDays - i, muted: true });
      }
      for (let i = 1; i <= daysInMonth; i++) {
        cells.push({ d: i, muted: false });
      }
      while (cells.length % 7 !== 0) {
        cells.push({ d: cells.length - daysInMonth - firstDay + 1, muted: true });
      }

      const gotoPrev = () => {
        if (viewMonth === 0) { setViewYear(viewYear - 1); setViewMonth(11); }
        else { setViewMonth(viewMonth - 1); }
      };
      const gotoNext = () => {
        if (viewMonth === 11) { setViewYear(viewYear + 1); setViewMonth(0); }
        else { setViewMonth(viewMonth + 1); }
      };

      return (
        <Popover onClose={onClose}>
          <div className="date-picker">
            <div className="dp-head">
              <button type="button" className="nav-btn" onClick={gotoPrev} aria-label="上月">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6" /></svg>
              </button>
              <div className="month-label">{monthLabel}</div>
              <button type="button" className="nav-btn" onClick={gotoNext} aria-label="下月">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6" /></svg>
              </button>
            </div>
            <div className="week-row">
              {['日','一','二','三','四','五','六'].map((w) => <div key={w}>{w}</div>)}
            </div>
            <div className="day-row">
              {cells.map((c, i) => {
                const cellDate = new Date(c.muted
                  ? (c.d > 15 ? new Date(viewYear, viewMonth - 1, c.d) : new Date(viewYear, viewMonth + 1, c.d))
                  : new Date(viewYear, viewMonth, c.d));
                const isToday = cellDate.toDateString() === today.toDateString();
                const isSelected = selected && cellDate.toDateString() === selected.toDateString();
                return (
                  <div
                    key={i}
                    className={[
                      'day',
                      c.muted ? 'muted' : '',
                      isToday ? 'today' : '',
                      isSelected ? 'selected' : '',
                    ].join(' ').trim()}
                    onClick={() => {
                      onSelect(formatDate(cellDate));
                      onClose();
                    }}
                  >{c.d}</div>
                );
              })}
            </div>
          </div>
        </Popover>
      );
    }

          if (!d.amount || Number(d.amount) <= 0) errs[`d${i}_amount`] = '请输入金额';
          if (!d.date) errs[`d${i}_date`] = '请选择日期';
          if (!d.type) errs[`d${i}_type`] = '请选择类型';
        });
        if (!approval.payer) errs.payer = '请选择付款人';
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = () => {
        if (!validate()) {
          showToast('请补全必填项后再提交', 'error');
          return;
        }
        showToast(`已提交报销单 · 总额 ¥${formatMoney(total)}`, 'success');
      };
      const handleSaveDraft = () => {
        showToast('已保存为草稿', 'success');
      };

      const removeChat = (val) => {
        setChats((arr) => arr.filter((c) => c.value !== val));
      };

      return (
        <div className="stage">
          <div className="device">
            <div className="nav-bar">
              <button type="button" className="back" aria-label="返回">
                <Icon.Back />
              </button>
              <div className="title">日常报销</div>
            </div>

            <button type="button" className="related-pill" onClick={() => showToast('选择关联申请单')}>
              <span className="icon"><Icon.Link /></span>
              <span className="text">+ 请选择</span>
              <span className="chevron"><Icon.ChevronRight /></span>
            </button>

            <div className="total-card">
              <div className="label">报销总额</div>
              <div className="amount">
                <span className="symbol">¥</span>
                <span className="num">{formatMoney(total)}</span>
              </div>
              <div className="actions">
                <button type="button" className="action" onClick={() => showToast('批量导入')}>
                  <Icon.Upload />
                  <span>批量导入</span>
                </button>
                <button type="button" className="action" onClick={() => showToast('导入随手记')}>
                  <Icon.Note />
                  <span>导入随手记</span>
                </button>
                <button type="button" className="action" onClick={() => showToast('智能识别发票')}>
                  <Icon.Scan />
                  <span>发票识别</span>
                </button>
              </div>
            </div>

            {details.map((d, i) => (
              <DetailCard
                key={i}
                idx={i}
                detail={d}
                errors={errors}
                onChange={updateDetail}
                onRemove={removeDetail}
                canRemove={details.length > 1}
              />
            ))}

            <button type="button" className="add-detail-card" onClick={addDetail}>
              <Icon.Plus /> 添加报销明细
            </button>

            <div className="card">
              <div className="section-title">
                <span>发票</span>
                <button type="button" className="add-btn">
                  <Icon.Plus /> 添加发票
                </button>
              </div>
              <div className="sub-block" style={{ background: 'var(--brand-canvas)' }}>
                <p className="hint">支持智能识别电子、纸质发票的金额等信息</p>
                <div className="chip-row">
                  <span
                    className={`chip ${globalInvoiceStatus === 'none' ? 'active' : ''}`}
                    onClick={() => setGlobalInvoiceStatus('none')}
                  >无发票</span>
                  <span
                    className={`chip ${globalInvoiceStatus === 'pending' ? 'active' : ''}`}
                    onClick={() => setGlobalInvoiceStatus('pending')}
                  >
                    待收发票
                    <span className="help"><Icon.QuestionMark /></span>
                  </span>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="field readonly-field">
                <Label>归属人</Label>
                <div className="value">{attribution.person}</div>
              </div>
              <div className="field readonly-field">
                <Label>归属部门</Label>
                <div className="value">{attribution.department}</div>
              </div>
              <div className="field block">
                <Label>备注</Label>
                <div className="control start" style={{ width: '100%' }}>
                  <textarea
                    placeholder="请输入"
                    value={attribution.remarks}
                    onChange={(e) => setAttribution({ ...attribution, remarks: e.target.value })}
                    rows={2}
                    aria-label="备注"
                  />
                </div>
              </div>
            </div>

            <div className="card">
              <Field label="项目">
                <div
                  className={`picker-trigger ${!extended.project ? 'placeholder' : ''}`}
                  onClick={() => setOpenPicker('project')}
                >
                  <span>{(PROJECTS.find((p) => p.value === extended.project) || {}).label || '请选择'}</span>
                  <span className="suffix"><Icon.ChevronRight /></span>
                </div>
              </Field>
              <Field label="客户">
                <div
                  className={`picker-trigger ${!extended.customer ? 'placeholder' : ''}`}
                  onClick={() => setOpenPicker('customer')}
                >
                  <span>{(CUSTOMERS.find((c) => c.value === extended.customer) || {}).label || '请选择'}</span>
                  <span className="suffix"><Icon.ChevronRight /></span>
                </div>
              </Field>
              <Field label="收款账户">
                <div
                  className={`picker-trigger ${!extended.bankAccount ? 'placeholder' : ''}`}
                  onClick={() => setOpenPicker('bank')}
                >
                  <span>{(BANK_ACCOUNTS.find((b) => b.value === extended.bankAccount) || {}).label || '请选择'}</span>
                  <span className="suffix"><Icon.ChevronRight /></span>
                </div>
              </Field>
              <Field label="企业主体">
                <div
                  className={`picker-trigger ${!extended.company ? 'placeholder' : ''}`}
                  onClick={() => setOpenPicker('company')}
                >
                  <span>{(COMPANIES.find((c) => c.value === extended.company) || {}).label || '请选择'}</span>
                  <span className="suffix"><Icon.ChevronRight /></span>
                </div>
              </Field>
              <Field label="付款时间">
                <div
                  className={`picker-trigger ${!extended.payTime ? 'placeholder' : ''}`}
                  onClick={() => setOpenPicker('paytime')}
                >
                  <span>{extended.payTime || '请选择'}</span>
                  <span className="suffix"><Icon.Calendar /></span>
                </div>
              </Field>
            </div>

            <div className="card">
              <div className="notify-section">
                <div className="row">
                  <div className="left">
                    <span>发送到聊天</span>
                    <span className="help" style={{ color: 'var(--brand-mute)' }}><Icon.QuestionMark /></span>
                  </div>
                  <button
                    type="button"
                    className="add-btn"
                    onClick={() => setOpenPicker('chat')}
                  >
                    <Icon.Plus /> 添加
                  </button>
                </div>
                {chats.length > 0 && (
                  <div className="notify-tags">
                    {chats.map((c) => (
                      <span key={c.value} className="tag-pill">
                        <span className="avatar">{c.label[0]}</span>
                        {c.label}
                        <span className="close" onClick={() => removeChat(c.value)}>
                          <Icon.Close />
                        </span>
                      </span>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="card">
              <div className="section-title"><span>流程</span></div>
              <div className="flow-list">
                <div className="flow-item">
                  <div className="dot" />
                  <div className="info">
                    <div className="name">审批人</div>
                    <div className="meta">
                      {approval.approver
                        ? `${(APPROVERS.find((a) => a.value === approval.approver) || {}).label} · ${(APPROVERS.find((a) => a.value === approval.approver) || {}).title}`
                        : '请选择审批人'}
                    </div>
                  </div>
                  <button
                    type="button"
                    className="add-btn-icon"
                    onClick={() => setOpenPicker('approver')}
                    aria-label="选择审批人"
                  ><Icon.Plus /></button>
                </div>
                <div className={`flow-item ${errors.payer ? 'has-error' : ''}`}>
                  <div className="dot" />
                  <div className="info">
                    <div className="name">
                      <span>付款人</span>
                      <span className="req">*</span>
                    </div>
                    <div className="meta">
                      {approval.payer
                        ? `${(APPROVERS.find((a) => a.value === approval.payer) || {}).label} · ${(APPROVERS.find((a) => a.value === approval.payer) || {}).title}`
                        : '请选择'}
                    </div>
                  </div>
                  <button
                    type="button"
                    className="add-btn-icon"
                    onClick={() => setOpenPicker('payer')}
                    aria-label="选择付款人"
                  ><Icon.Plus /></button>
                </div>
                <div className="flow-item">
                  <div className="dot" />
                  <div className="info">
                    <div className="name">抄送人</div>
                    <div className="meta">请选择抄送人</div>
                  </div>
                  <button type="button" className="add-btn-icon" aria-label="选择抄送人"><Icon.Plus /></button>
                </div>
              </div>
            </div>

            <div className="ding-footer">
              <div className="logo">
                <span className="mark">D</span>
                <span>钉钉</span>
              </div>
              <div className="tagline">AI 时代的工作方式</div>
            </div>

            <div className="bottom-bar">
              <button type="button" className="btn btn-secondary" onClick={handleSaveDraft}>
                保存草稿
              </button>
              <button type="button" className="btn btn-primary" onClick={handleSubmit}>
                提交
              </button>
            </div>

            {openPicker === 'project' && (
              <OptionList
                title="选择项目"
                options={PROJECTS}
                value={extended.project}
                onSelect={(o) => setExtended({ ...extended, project: o.value })}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'customer' && (
              <OptionList
                title="选择客户"
                options={CUSTOMERS}
                value={extended.customer}
                onSelect={(o) => setExtended({ ...extended, customer: o.value })}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'bank' && (
              <OptionList
                title="选择收款账户"
                options={BANK_ACCOUNTS}
                value={extended.bankAccount}
                onSelect={(o) => setExtended({ ...extended, bankAccount: o.value })}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'company' && (
              <OptionList
                title="选择企业主体"
                options={COMPANIES}
                value={extended.company}
                onSelect={(o) => setExtended({ ...extended, company: o.value })}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'approver' && (
              <OptionList
                title="选择审批人"
                options={APPROVERS}
                value={approval.approver}
                onSelect={(o) => setApproval({ ...approval, approver: o.value })}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'payer' && (
              <OptionList
                title="选择付款人"
                options={APPROVERS}
                value={approval.payer}
                onSelect={(o) => { setApproval({ ...approval, payer: o.value }); setErrors({ ...errors, payer: undefined }); }}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'chat' && (
              <OptionList
                title="选择发送对象"
                options={CHAT_USERS.filter((u) => !chats.find((c) => c.value === u.value))}
                value=""
                onSelect={(o) => setChats([...chats, o])}
                onClose={() => setOpenPicker(null)}
              />
            )}
            {openPicker === 'paytime' && (
              <DatePicker
                value={extended.payTime}
                onSelect={(d) => setExtended({ ...extended, payTime: d })}
                onClose={() => setOpenPicker(null)}
              />
            )}

            {toast && (
              <div
                className={`toast ${toast.type}`}
                role={toast.type === 'error' ? 'alert' : 'status'}
                aria-live={toast.type === 'error' ? 'assertive' : 'polite'}
                aria-atomic="true"
              >
                {toast.type === 'success' && <Icon.Check />}
                {toast.type === 'error' && <Icon.Information />}
                {toast.message}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
